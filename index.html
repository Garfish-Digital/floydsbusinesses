<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floyd | Plumbing & Videography</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <!-- Background animated elements -->
        <div class="bg-elements">
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
        </div>
        
        <div class="content">
            <!-- Profile Section -->
            <div class="profile-section">
                <div class="profile-image-container">
                    <img src="images/floyd-himself.jpg" alt="Floyd" class="profile-image">
                    <div class="profile-glow"></div>
                </div>
                <div class="profile-info">
                    <h1 class="name">Floyd</h1>
                    <p class="tagline opacity-50">Fixing pipes and capturing stories</p>
                    <div class="contact-info">
                        <div class="contact-item">
                            <!-- <span class="contact-icon">📧</span> -->
                            <span>crentoonnetworthllc@gmail.com</span>
                        </div>
                        <div class="contact-item">
                            <!-- <span class="contact-icon">📱</span> -->
                            <span>(217) 918-1273</span>
                        </div>
                        <div class="contact-item">
                            <!-- <span class="contact-icon">📍</span> -->
                            <span>Indianapolis, IN</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Business Links Section -->
            <div class="business-links">
                <a href="/the_house_surgeon/" class="business-card plumbing" data-business="plumbing">
                    <div class="business-icon">
                        <!-- <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3c-3 4-7 6-7 10 0 6 4 8 7 8s7-2 7-8c0-4-4-6-7-10z"/>
                        </svg> -->
                        <img src="images/house-surgeon-logo.PNG" alt="Floyd Williams Master Plumber" id="plumber-img"
                        class="rounded-md border-4 border-[#22c55e] mb-6 shadow-lg" />
                    </div>
                    <div class="business-content">
                        <h2>The House Surgeon</h2>
                        <p>Professional plumbing solutions for residential and commercial needs</p>
                        <div class="business-arrow">→</div>
                    </div>
                </a>

                <a href="/crentoon_studios/" class="business-card videography" data-business="videography">
                    <div class="business-icon">
                        <!-- <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="23 7 16 12 23 17 23 7"/>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                        </svg> -->
                        <img src="images/crentoon-logo.PNG" alt="Floyd Williams Master Plumber" id="plumber-img"
                        class="rounded-md border-4 border-[#22c55e] mb-6 shadow-lg" />
                    </div>
                    <div class="business-content">
                        <h2>Crentoon Studios</h2>
                        <p>Creative video production and cinematography services</p>
                        <div class="business-arrow">→</div>
                    </div>
                </a>
            </div>
        </div>

        <!-- Transition overlay -->
        <div class="transition-overlay">
            <div class="transition-content">
                <div class="loading-spinner"></div>
                <p class="transition-text">Loading...</p>
            </div>
        </div>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
